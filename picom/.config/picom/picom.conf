# picom compositor, started by awesome (modules/autostart.lua).
# Restart after editing: pkill -x picom, then Mod4+Ctrl+r.

backend = "glx";
vsync = true;

# Soft shadows around windows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "_GTK_FRAME_EXTENTS@",          # GTK apps with client-side shadows draw their own
  "class_g = 'flameshot'",
];

# Short fade when windows open, close or change opacity
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

# Don't fade/shadow the bar, menus and drag-and-drop icons
wintypes: {
  dock          = { shadow = false; };
  dnd           = { shadow = false; fade = false; };
  dropdown_menu = { shadow = false; };
  popup_menu    = { shadow = false; };
  tooltip       = { shadow = false; };
};

# Let fullscreen games/videos bypass the compositor
unredir-if-possible = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
