# Touchpad settings (libinput). Installed by install.sh with sudo.
# Applies after the next X restart (log out and in, or reboot).
# Options: man 4 libinput
Section "InputClass"
    Identifier      "touchpad"
    MatchIsTouchpad "on"
    MatchDriver     "libinput"

    # Tap to click: 1 finger = left, 2 fingers = right, 3 fingers = middle
    Option "Tapping"          "on"
    Option "TappingButtonMap" "lrm"

    # Content follows the fingers (like a phone)
    Option "NaturalScrolling" "true"
EndSection
