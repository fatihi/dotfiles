# Login and lock screen (light-locker uses the LightDM greeter to unlock).
# Installed by install.sh with sudo; the original is kept as *.orig.
[greeter]
theme-name=dracula-gtk-theme
icon-theme-name=Adwaita
background=#21222c
user-background=false
font-name=sans 11
clock-format=%a %d.%m. %H:%M
indicators=~host;~spacer;~clock;~spacer;~layout;~session;~a11y;~power
