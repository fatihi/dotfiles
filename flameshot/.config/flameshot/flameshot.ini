[General]
; Flameshot 14 captures through the XDG desktop portal by default, which
; doesn't work under awesome (no portal backend). Use direct X11 capture.
useX11LegacyScreenshot=true

; Dracula colours for the selection UI and drawing tools
uiColor=#bd93f9
contrastUiColor=#282a36
drawColor=#ff5555

showStartupLaunchMessage=false
